  service: Disk
  root: <%= ENV['ACTIVE_STORAGE_PERSISTENT_DIR'].presence || (Dir.exist?('/data') && File.writable?('/data') ? '/data/storage' : (Dir.exist?('/var/data') && File.writable?('/var/data') ? '/var/data/storage' : Rails.root.join("storage").to_s)) %>

